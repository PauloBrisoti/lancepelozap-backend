name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  JWT_SECRET: ci-test-secret
  NODE_ENV: test
  # Banco efêmero do runner — não é segredo real (container vive só durante o job)
  TEST_DB_URL: postgresql://saas_admin:ci-only-not-a-secret@127.0.0.1:5432/saas_db?schema=public

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saas_admin
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: saas_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ env.TEST_DB_URL }}

      - name: Sync Database Schema
        run: npx prisma db push
        env:
          DATABASE_URL: ${{ env.TEST_DB_URL }}

      - name: TypeScript Check
        run: npx tsc --noEmit

      # Typecheck também os testes (tsconfig do backend os exclui por padrão)
      - name: TypeScript Check (testes)
        run: npx tsc --noEmit -p tsconfig.test.json

      - name: Run Tests
        run: npx vitest run
        env:
          DATABASE_URL: ${{ env.TEST_DB_URL }}
