# Redis — config endurecida para o rate limiting distribuído
# Copiada para /etc/redis/redis.conf pelo install-redis.sh (com requirepass injetado)
# Refs: https://raw.githubusercontent.com/redis/redis/7.0/redis.conf

bind 127.0.0.1 ::1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# --- Autenticação (injetada pelo install-redis.sh) ---
requirepass __REDIS_PASSWORD__

# --- Persistência: contadores podem ser perdidos em restart sem isto ---
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
save 900 1
save 300 10
save 60 10000
dir /var/lib/redis

# --- Memória: rate limit só usa chaves com TTL; noeviction é o seguro ---
maxmemory 128mb
maxmemory-policy noeviction
maxmemory-samples 5

# --- Hardening: comandos perigosos indisponíveis via rede ---
rename-command CONFIG ""
rename-command FLUSHALL ""
rename-command FLUSHDB ""

# --- Logs para o journald (systemd) ---
loglevel notice
logfile ""

# --- Diagnóstico ---
latency-monitor-threshold 0
